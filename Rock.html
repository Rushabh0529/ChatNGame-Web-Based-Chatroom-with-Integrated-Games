<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors - Smart AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1a1a1a;
      color: #f2f2f2;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background-color: #2c2c2c;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
      width: 90%;
      max-width: 500px;
    }

    h1 {
      color: #ffd700;
      margin-bottom: 20px;
      font-size: 2.5em;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .choices button {
      font-size: 2em;
      padding: 20px;
      border-radius: 15px;
      border: none;
      background-color: #444;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    .choices button:hover {
      background-color: #ffd700;
      color: #000;
    }

    .status {
      margin-top: 20px;
      font-size: 1.2em;
      color: #ccc;
    }

    .result {
      font-size: 1.8em;
      font-weight: bold;
      margin: 20px 0;
      color: #ffd700;
    }

    .scoreboard {
      margin-top: 10px;
      font-size: 1.2em;
    }

    .reset {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #ffd700;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .reset:hover {
      background-color: #e0c200;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Rock Paper Scissors - Smart AI</h1>
  <div class="choices">
    <button onclick="play('rock')">✊</button>
    <button onclick="play('paper')">✋</button>
    <button onclick="play('scissors')">✌️</button>
  </div>
  <div class="result" id="result"></div>
  <div class="status" id="status">Make your move!</div>
  <div class="scoreboard">
    You: <span id="playerScore">0</span> | Computer: <span id="computerScore">0</span>
  </div>
  <button class="reset" onclick="resetGame()">Reset</button>
</div>

<script>
  let playerScore = 0;
  let computerScore = 0;
  let moveHistory = {
    rock: 0,
    paper: 0,
    scissors: 0
  };

  function play(playerChoice) {
    moveHistory[playerChoice]++;
    const computerChoice = smartComputerChoice();

    let resultText = '';
    if (playerChoice === computerChoice) {
      resultText = "It's a draw!";
    } else if (
      (playerChoice === 'rock' && computerChoice === 'scissors') ||
      (playerChoice === 'paper' && computerChoice === 'rock') ||
      (playerChoice === 'scissors' && computerChoice === 'paper')
    ) {
      resultText = "You win!";
      playerScore++;
    } else {
      resultText = "Computer wins!";
      computerScore++;
    }

    document.getElementById('result').textContent = resultText;
    document.getElementById('status').textContent = `You chose ${playerChoice}, Computer chose ${computerChoice}`;
    document.getElementById('playerScore').textContent = playerScore;
    document.getElementById('computerScore').textContent = computerScore;
  }

  function smartComputerChoice() {
    // Determine your most common move
    const maxMove = Object.entries(moveHistory).sort((a, b) => b[1] - a[1])[0][0];

    // Choose the counter to that move
    switch (maxMove) {
      case 'rock': return 'paper';     // paper beats rock
      case 'paper': return 'scissors'; // scissors beats paper
      case 'scissors': return 'rock';  // rock beats scissors
      default: return ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
    }
  }

  function resetGame() {
    playerScore = 0;
    computerScore = 0;
    moveHistory = { rock: 0, paper: 0, scissors: 0 };
    document.getElementById('playerScore').textContent = playerScore;
    document.getElementById('computerScore').textContent = computerScore;
    document.getElementById('result').textContent = '';
    document.getElementById('status').textContent = 'Make your move!';
  }
</script>

</body>
</html>
